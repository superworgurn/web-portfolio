<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>Charif</title>
    <meta name="description" content="Portfolio of John Doe, a Full Stack Developer specializing in React, TypeScript, and modern web technologies. View projects, skills, and contact information.">
    <meta name="keywords" content="Charif,Showcase,">
    <meta name="author" content="Worgurn Ruenpitak">
    <meta name="robots" content="Worgurn Ruenpitak" />
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://yourportfolio.com/">
    <meta property="og:title" content="John Doe - Full Stack Developer Portfolio">
    <meta property="og:description" content="Portfolio of John Doe, a Full Stack Developer specializing in React, TypeScript, and modern web technologies.">
    <meta property="og:image" content="https://yourportfolio.com/og-image.png">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://yourportfolio.com/">
    <meta property="twitter:title" content="John Doe - Full Stack Developer Portfolio">
    <meta property="twitter:description" content="Portfolio of John Doe, a Full Stack Developer specializing in React, TypeScript, and modern web technologies.">
    <meta property="twitter:image" content="https://yourportfolio.com/twitter-image.png">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="icon.webp" loading="lazy"/>
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://yourportfolio.com" />
    
    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "John Doe",
      "url": "https://yourportfolio.com",
      "image": "https://yourportfolio.com/profile.jpg",
      "jobTitle": "Full Stack Developer",
      "sameAs": [
        "https://github.com/johndoe",
        "https://linkedin.com/in/johndoe",
        "https://twitter.com/johndoe"
      ],
      "knowsAbout": ["Web Development", "React", "TypeScript", "Node.js", "UI/UX Design"]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" async src="src/main.tsx"></script>
  </body>
</html>
